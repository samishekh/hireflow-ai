services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hireflow
      POSTGRES_PASSWORD: hireflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hireflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  resume-parser-service:
    build: ./resume-parser-service
    env_file:
      - path: ./resume-parser-service/.env
        required: false
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  job-matcher-service:
    build: ./job-matcher-service
    env_file:
      - path: ./job-matcher-service/.env
        required: false
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  core-api:
    build: ./core-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hireflow
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: hireflow
      HIREFLOW_PARSER_BASE_URL: http://resume-parser-service:8000
      HIREFLOW_MATCHER_BASE_URL: http://job-matcher-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      resume-parser-service:
        condition: service_healthy
      job-matcher-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  postgres-data:
