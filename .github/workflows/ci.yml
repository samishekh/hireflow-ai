name: CI

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parser:
    name: resume-parser-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: resume-parser-service/requirements-dev.txt
      - name: Install
        working-directory: resume-parser-service
        run: pip install -r requirements-dev.txt
      - name: Tests
        working-directory: resume-parser-service
        run: pytest

  matcher:
    name: job-matcher-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-matcher-service/requirements-dev.txt
      - name: Install
        working-directory: job-matcher-service
        run: pip install -r requirements-dev.txt
      - name: Tests and evaluation set
        working-directory: job-matcher-service
        run: pytest

  core-api:
    name: core-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests
        working-directory: core-api
        run: ./mvnw -B verify

  web-ui:
    name: web-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Install
        working-directory: web-ui
        run: npm ci
      - name: Tests
        working-directory: web-ui
        run: npm test
      - name: Typecheck and build
        working-directory: web-ui
        run: npm run build

  images:
    name: Publish images
    needs: [parser, matcher, core-api, web-ui]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [resume-parser-service, job-matcher-service, core-api, web-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
