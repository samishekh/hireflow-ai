apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ui
  namespace: hireflow
  labels:
    app.kubernetes.io/name: web-ui
    app.kubernetes.io/part-of: hireflow
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Certificate must be in ACM, in the same region as the cluster.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERTIFICATE_ID
    alb.ingress.kubernetes.io/healthcheck-path: /
    # Parse and score hold one request open. The default idle timeout is 60s.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=180
spec:
  ingressClassName: alb
  rules:
    - host: hireflow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-ui
                port:
                  number: 80
