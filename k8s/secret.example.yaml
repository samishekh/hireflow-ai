# Shape of the Secret to create in the hireflow namespace. Do not commit real
# values, and do not apply this file as-is. On EKS, store these in SSM
# Parameter Store and sync them into a Secret named hireflow.
# An empty ANTHROPIC_API_KEY keeps the parser and matcher in mock mode.
# An empty CLAUDE_MODEL leaves each service on its built-in default.
apiVersion: v1
kind: Secret
metadata:
  name: hireflow
  namespace: hireflow
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-me
  ANTHROPIC_API_KEY: ""
  CLAUDE_MODEL: ""
