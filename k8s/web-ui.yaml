apiVersion: v1
kind: Service
metadata:
  name: web-ui
  namespace: hireflow
  labels:
    app.kubernetes.io/name: web-ui
    app.kubernetes.io/part-of: hireflow
spec:
  selector:
    app.kubernetes.io/name: web-ui
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  namespace: hireflow
  labels:
    app.kubernetes.io/name: web-ui
    app.kubernetes.io/part-of: hireflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-ui
        app.kubernetes.io/part-of: hireflow
    spec:
      imagePullSecrets:
        - name: ghcr
      initContainers:
        - name: wait-for-core-api
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until wget -q -T 2 -O - http://core-api:8080/actuator/health | grep -q '"status":"UP"'; do
                echo "waiting for core-api"
                sleep 2
              done
      containers:
        - name: web-ui
          image: ghcr.io/samishekh/hireflow-ai/web-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
