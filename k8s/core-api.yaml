apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: hireflow
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: hireflow
spec:
  selector:
    app.kubernetes.io/name: core-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: hireflow
  labels:
    app.kubernetes.io/name: core-api
    app.kubernetes.io/part-of: hireflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-api
        app.kubernetes.io/part-of: hireflow
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: core-api
          image: ghcr.io/samishekh/hireflow-ai/core-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: hireflow
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: hireflow
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hireflow
                  key: POSTGRES_PASSWORD
            - name: HIREFLOW_PARSER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: hireflow
                  key: HIREFLOW_PARSER_BASE_URL
            - name: HIREFLOW_MATCHER_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: hireflow
                  key: HIREFLOW_MATCHER_BASE_URL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
