apiVersion: v1
kind: Service
metadata:
  name: job-matcher-service
  namespace: hireflow
  labels:
    app.kubernetes.io/name: job-matcher-service
    app.kubernetes.io/part-of: hireflow
spec:
  selector:
    app.kubernetes.io/name: job-matcher-service
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-matcher-service
  namespace: hireflow
  labels:
    app.kubernetes.io/name: job-matcher-service
    app.kubernetes.io/part-of: hireflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: job-matcher-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: job-matcher-service
        app.kubernetes.io/part-of: hireflow
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: job-matcher-service
          image: ghcr.io/samishekh/hireflow-ai/job-matcher-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hireflow
                  key: ANTHROPIC_API_KEY
            - name: CLAUDE_MODEL
              valueFrom:
                secretKeyRef:
                  name: hireflow
                  key: CLAUDE_MODEL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
