apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: hireflow
  region: us-east-1
  version: "1.37"

vpc:
  nat:
    gateway: Disable

managedNodeGroups:
  - name: ng-1
    instanceType: t3.medium
    desiredCapacity: 1
    minSize: 1
    maxSize: 1
    volumeSize: 20
    privateNetworking: false
